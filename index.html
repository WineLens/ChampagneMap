<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Explorez les terroirs, régions et communes viticoles de Champagne avec WineLens.">
  <title>WineLens — Champagne Map</title>
  <link rel="preconnect" href="https://unpkg.com">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="./" aria-label="WineLens Champagne Map">
        <span class="brand-mark">W</span>
        <span><strong>WineLens</strong><small>Champagne Map</small></span>
      </a>
      <div class="search-wrap">
        <label class="sr-only" for="mapSearch">Rechercher une commune</label>
        <input id="mapSearch" type="search" placeholder="Rechercher une commune…" autocomplete="off">
        <div id="searchResults" class="search-results" hidden></div>
      </div>
      <button id="resetMap" class="ghost-button" type="button">Vue Champagne</button>
    </header>

    <main class="workspace">
      <section class="map-panel" aria-label="Carte des terroirs de Champagne">
        <div id="map"></div>
        <div class="map-hint">Survolez pour découvrir · Cliquez pour sélectionner</div>
      </section>

      <aside class="info-panel" id="infoPanel">
        <div class="eyebrow" id="zoneKind">CHAMPAGNE</div>
        <h1 id="typeOfZone">Explorez les terroirs</h1>
        <p class="lead" id="f3">Zoomez ou sélectionnez une zone sur la carte pour afficher ses informations.</p>
        <div class="divider"></div>
        <div class="detail-grid">
          <div><span>Zone</span><strong id="f1">—</strong></div>
          <div><span>Code</span><strong id="f2">—</strong></div>
        </div>
        <div id="legacyCards" class="legacy-cards">
          <article id="exemple-1"><a id="link1"></a><p id="text1"></p></article>
          <article id="exemple-2"><a id="link2"></a><p id="text2"></p></article>
          <article id="exemple-3"><a id="link3"></a><p id="text3"></p></article>
        </div>
        <p class="panel-note">Les informations disponibles dépendent des données actuellement renseignées dans la carte.</p>
      </aside>
    </main>
  </div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="./script.js"></script>
</body>
</html>
